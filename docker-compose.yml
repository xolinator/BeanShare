services:
  beanshare-postgres:
    image: postgres:15-alpine
    container_name: beanshare-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: beanshare_dev
      POSTGRES_USER: beanshare
      POSTGRES_PASSWORD: beanshare123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - beanshare_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanshare -d beanshare_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  beanshare-keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: beanshare-keycloak-dev
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  beanshare-postgres-test:
    image: postgres:15-alpine
    container_name: beanshare-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: beanshare_test
      POSTGRES_USER: beanshare_test
      POSTGRES_PASSWORD: beanshare_test123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - beanshare_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanshare_test -d beanshare_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  beanshare_postgres_data:
    driver: local
  beanshare_postgres_test_data:
    driver: local