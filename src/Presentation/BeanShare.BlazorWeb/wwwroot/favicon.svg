<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- BeanShare Favicon - Coffee bean with S-curve, rotated 15 degrees -->
  <g transform="rotate(15, 16, 16)">
    <!-- Bean shape (ellipse) -->
    <ellipse cx="16" cy="16" rx="11" ry="14" fill="#0000FF"/>
    <!-- S-curve groove in the bean -->
    <path d="M 16 3
             C 10 7, 10 12, 16 16
             C 22 20, 22 25, 16 29"
          stroke="white"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"/>
  </g>
</svg>