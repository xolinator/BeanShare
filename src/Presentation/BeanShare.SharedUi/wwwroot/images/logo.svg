<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- BeanShare Logo - Coffee bean with S-curve, rotated 15 degrees -->
  <g transform="rotate(15, 50, 50)">
    <!-- Bean shape (ellipse) -->
    <ellipse cx="50" cy="50" rx="35" ry="45" fill="#0000FF"/>
    <!-- S-curve groove in the bean -->
    <path d="M 50 10
             C 30 25, 30 40, 50 50
             C 70 60, 70 75, 50 90"
          stroke="white"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"/>
  </g>
</svg>