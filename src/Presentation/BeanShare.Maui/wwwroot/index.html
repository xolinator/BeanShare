<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>(function(){var t=localStorage.getItem('beanshare-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>BeanShare</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/beanshare.css" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/components/dashboard.css" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/components/layout.css" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/components/pages.css" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/components/admin.css" />
    <link rel="stylesheet" href="_content/BeanShare.SharedUi/css/components/consumption.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BeanShare.Maui.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div style="padding: 20px; text-align: center;">
            <h2>Loading BeanShare...</h2>
            <p>Initializing Blazor components...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/BeanShare.SharedUi/js/qrcode.js"></script>
    <script src="_content/BeanShare.SharedUi/js/html5-qrcode.min.js"></script>
    <script src="_content/BeanShare.SharedUi/js/qrscanner.js"></script>
    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        console.log('[BeanShare] index.html loaded at', new Date().toISOString());

        window.addEventListener('error', function(event) {
            console.error('[BeanShare] JavaScript error:', event.message, 'at', event.filename, ':', event.lineno);
            if (event.error) {
                console.error('[BeanShare] Stack:', event.error.stack);
            }

            var errorUi = document.getElementById('blazor-error-ui');
            if (errorUi) {
                errorUi.style.display = 'block';
            }
        });

        window.addEventListener('unhandledrejection', function(event) {
            console.error('[BeanShare] Unhandled promise rejection:', event.reason);
        });

        var checkBlazor = setInterval(function() {
            if (typeof Blazor !== 'undefined') {
                console.log('[BeanShare] Blazor is now available');
                clearInterval(checkBlazor);
            }
        }, 100);

        if (typeof DotNet !== 'undefined') {
            console.log('[BeanShare] DotNet interop is available');
        }
    </script>

</body>

</html>
