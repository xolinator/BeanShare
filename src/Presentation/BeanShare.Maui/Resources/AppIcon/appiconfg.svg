<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- BeanShare Logo - Coffee bean with S-curve, rotated 15 degrees, white on transparent -->
    <g transform="translate(228, 228) rotate(15) translate(-228, -228)">
        <!-- Bean shape (ellipse) -->
        <ellipse cx="228" cy="228" rx="140" ry="180" fill="white"/>
        <!-- S-curve groove in the bean -->
        <path d="M 228 48
                 C 148 108, 148 168, 228 228
                 C 308 288, 308 348, 228 408"
              stroke="#0000FF"
              stroke-width="24"
              fill="none"
              stroke-linecap="round"/>
    </g>
</svg>