app = "beanshare-keycloak"
primary_region = "fra"

[env]
  KC_DB = "postgres"
  KC_HEALTH_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/realms/master"
    interval = "30s"
    timeout = "10s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
